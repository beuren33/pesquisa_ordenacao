<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordenacao em Assembly</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Ordenacao em Assembly</h1>
</header>

<nav class="abas">
  <button class="aba-btn ativa" data-aba="bubble">Bubble Sort</button>
  <button class="aba-btn" data-aba="insertion">Insertion Sort</button>
  <button class="aba-btn" data-aba="shell">Shell Sort</button>
  <button class="aba-btn" data-aba="selection">Selection Sort</button>
  <button class="aba-btn" data-aba="quick">Quick Sort</button>
  <button class="aba-btn" data-aba="merge">Merge Sort</button>
  <button class="aba-btn" data-aba="comparativo">Comparativo</button>
</nav>

<template id="template-painel">
  <section class="painel">
    <div class="linha-topo">
      <div class="cartao">
        <h2>1. Gerar dataset</h2>
        <div class="linha-form">
          <label>
            Tamanho
            <select class="select-tamanho"></select>
          </label>
          <label>
            Tipo
            <select class="select-tipo"></select>
          </label>
          <button class="btn btn-gerar">Gerar dataset</button>
        </div>
        <p class="status-gerar"></p>
      </div>

      <div class="cartao">
        <h2>2. Escolher dataset</h2>
        <div class="linha-form">
          <label class="label-arquivo">
            Arquivo
            <select class="select-arquivo"></select>
          </label>
          <button class="btn btn-atualizar" title="Atualizar lista">Atualizar</button>
        </div>
      </div>

      <div class="cartao">
        <h2>3. Ordenar</h2>
        <button class="btn btn-primario btn-ordenar">Ordenar</button>
        <div class="cronometro-box">
          <span class="cronometro-label">Tempo:</span>
          <span class="cronometro-valor">00:00.000 min</span>
        </div>
        <div class="resultado"></div>
      </div>
    </div>

    <div class="progresso-box">
      <div class="progresso-barra">
        <div class="progresso-preenchimento"></div>
      </div>
      <span class="progresso-valor">0%</span>
    </div>

    <div class="cartao cartao-visual">
      <h2>Exemplo visual</h2>
      <p class="descricao-exemplo"></p>
      <div class="animacao">
        <div class="barras"></div>
      </div>
    </div>
  </section>
</template>

<main id="conteudo"></main>

<section class="painel painel-comparativo" data-aba="comparativo">
  <div class="cartao">
    <h2>Comparativo entre algoritmos</h2>
    <div class="linha-form">
      <label>
        Tipo de dataset
        <select id="select-tipo-comparativo">
          <option value="ordenado">ordenado</option>
          <option value="invertido">invertido</option>
          <option value="randomico" selected>randomico</option>
        </select>
      </label>
      <button class="btn btn-atualizar" id="btn-atualizar-comparativo">Atualizar</button>
    </div>
    <div id="grafico-linha-comparativo"></div>
  </div>

  <div class="cartao">
    <h2>Comparar algoritmos escolhidos</h2>
    <div class="linha-form">
      <label>
        Algoritmos
        <div class="dropdown-multi" id="filtro-algoritmos-comparativo">
          <button type="button" class="dropdown-multi-btn">
            <span class="dropdown-multi-rotulo">6 algoritmos</span>
            <span class="dropdown-multi-seta">▾</span>
          </button>
          <div class="dropdown-multi-lista" hidden>
            <label><input type="checkbox" value="bubble" checked> Bubble Sort</label>
            <label><input type="checkbox" value="insertion" checked> Insertion Sort</label>
            <label><input type="checkbox" value="shell" checked> Shell Sort</label>
            <label><input type="checkbox" value="selection" checked> Selection Sort</label>
            <label><input type="checkbox" value="quick" checked> Quick Sort</label>
            <label><input type="checkbox" value="merge" checked> Merge Sort</label>
          </div>
        </div>
      </label>
    </div>
    <div id="grafico-filtro-comparativo"></div>
  </div>
</section>

<script src="/app.js"></script>
</body>
</html>
